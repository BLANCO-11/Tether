apiVersion: v1
kind: Service
metadata:
  name: server
  labels: {{- include "foundry.labels" (dict "root" . "component" "server") | nindent 4 }}
spec:
  selector: {{- include "foundry.selector" (dict "root" . "component" "server") | nindent 4 }}
  ports:
    - { name: api, port: 4000, targetPort: 4000 }
    - { name: ws, port: 4001, targetPort: 4001 }
---
# ONE replica, and Recreate rather than RollingUpdate: the trigger scheduler runs inside this process
# (src/index.ts), and the auth throttle and policy proposals are in memory — two at once would fire
# scheduled triggers twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  labels: {{- include "foundry.labels" (dict "root" . "component" "server") | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "foundry.selector" (dict "root" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "foundry.labels" (dict "root" . "component" "server") | nindent 8 }}
      annotations:
        checksum/values: {{ toJson .Values | sha256sum | trunc 16 }}
    spec:
      # compose's `init: true`: the pause container becomes PID 1 and reaps what the verifier leaves.
      shareProcessNamespace: true
      initContainers:
        {{- include "foundry.waitForDb" . | nindent 8 }}
        - name: migrate
          image: {{ .Values.images.server }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          command: ["node", "packages/server/dist/db/migrate.js"]
          env:
            {{- include "foundry.dbEnv" (dict "root" . "name" "DATABASE_URL") | nindent 12 }}
            {{- include "foundry.secretEnv" (dict "root" . "keys" .Values.secretKeys.server) | nindent 12 }}
            {{- include "foundry.dbCaEnv" . | nindent 12 }}
          volumeMounts:
            {{- include "foundry.dbCaMount" . | nindent 12 }}
      containers:
        - name: server
          image: {{ .Values.images.server }}
          imagePullPolicy: {{ .Values.pullPolicy }}
          ports:
            - { name: api, containerPort: 4000 }
            - { name: ws, containerPort: 4001 }
          env:
            - { name: PORT, value: "4000" }
            - { name: WS_PORT, value: "4001" }
            - { name: NODE_ENV, value: production }
            # Service names, never host.docker.internal (there is no Docker host here).
            - { name: OPS_API_BASE, value: "http://ops-api:4004" }
            - { name: OPS_ADMIN_BASE, value: "http://ops-api:4004" }
            - { name: DEMO_DB_HOST, value: {{ .Values.database.host | quote }} }
            - { name: DEMO_DB_PORT, value: {{ .Values.database.port | quote }} }
            - { name: SANDBOX_DB_HOST, value: {{ .Values.database.host | quote }} }
            - { name: SANDBOX_DB_PORT, value: {{ .Values.database.port | quote }} }
            - { name: FORGE_HOST, value: "forge:4100" }
            - { name: FORGE_TOOL_URL, value: "http://server:4000/api/forge" }
            - { name: FLOW_RUNNER_URL, value: "http://flow-runner:4006" }
            - { name: FLOW_RUNNER_CALLBACK_BASE, value: "http://server:4000" }
            {{- if .Values.plugins.enabled }}
            - { name: PLUGINS_CONNECTOR_URL, value: "http://connector:4010" }
            {{- end }}
            {{- include "foundry.dbEnv" (dict "root" . "name" "DATABASE_URL") | nindent 12 }}
            {{- include "foundry.secretEnv" (dict "root" . "keys" .Values.secretKeys.server) | nindent 12 }}
            {{- include "foundry.dbCaEnv" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /api/health, port: 4000 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources: {{- toYaml .Values.resources.server | nindent 12 }}
          volumeMounts:
            - { name: sandboxes, mountPath: /repo/packages/server/.pi-sandboxes }
            - { name: mocks, mountPath: /repo/data/mocks }
            {{- include "foundry.dbCaMount" . | nindent 12 }}
      volumes:
        {{- include "foundry.dbCaVolume" . | nindent 8 }}
        - name: sandboxes
          persistentVolumeClaim: { claimName: foundry-sandboxes }
        - name: mocks
          persistentVolumeClaim: { claimName: foundry-mocks }
