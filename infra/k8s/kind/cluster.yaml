# A one-node kind cluster for testing the chart locally. The default CNI is OFF so Calico can be
# installed: kind's own network plugin does not enforce NetworkPolicies, and the isolation tests in
# check.sh would then pass for the wrong reason.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: foundry
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      # The ingress controller, reachable from the Mac at http://localhost:8088
      - { containerPort: 80, hostPort: 8088, protocol: TCP }
